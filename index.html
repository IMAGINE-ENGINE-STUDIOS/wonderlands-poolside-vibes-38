<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://bwngxlbnavnhbtahyzbf.supabase.co">
    
    <!-- Preload critical resources - build assets only -->
    
    <title>Wonderlands Pools & Spas | Luxury Fiberglass Pools</title>
    <meta name="description" content="Shop luxury fiberglass pools, spas, liners, tiles, and finishes. Customize models and request a quote." />
    <meta name="author" content="Wonderlands" />
    <link rel="canonical" href="/" />
    <link rel="icon" href="/lovable-uploads/d5bdd8c9-0227-43f1-81a3-467617ed6c73.png" type="image/png" />

    <!-- Critical CSS inlined for immediate render -->
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --primary: 210 100% 35%;
        --primary-foreground: 0 0% 98%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 45%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --border: 240 5.9% 90%;
        --ring: 210 100% 35%;
        --radius: 0.75rem;
        --teal: 180 100% 25%;
        --coral: 16 100% 66%;
        --gradient-primary: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--teal)));
        --gradient-secondary: linear-gradient(135deg, hsl(var(--teal)), hsl(var(--coral)));
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --primary: 210 100% 60%;
        --primary-foreground: 240 5.9% 10%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --accent: 240 3.7% 15.9%;
        --accent-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --ring: 210 100% 60%;
      }
      * { box-sizing: border-box; }
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      #root { min-height: 100vh; }
      .min-h-screen { min-height: 100vh; }
      .bg-background { background-color: hsl(var(--background)); }
      .text-foreground { color: hsl(var(--foreground)); }
      .relative { position: relative; }
      .overflow-hidden { overflow: hidden; }
      .flex { display: flex; }
      .hidden { display: none; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      img { max-width: 100%; height: auto; }
      
      /* Optimize initial paint */
      .animate-pulse { 
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
    </style>

    <meta property="og:title" content="Wonderlands Pools & Spas" />
    <meta property="og:description" content="Luxury fiberglass pools, spas, liners, tiles, and finishes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Wonderlands Pools & Spas",
        "description": "Luxury fiberglass pools, spas, liners, tiles, and finishes."
      }
    </script>
    <script>
      (function(){
        var l=document.querySelector('link[rel="canonical"]');
        var href=location.origin+location.pathname;
        if(l){l.setAttribute('href', href);} else {l=document.createElement('link');l.rel='canonical';l.href=href;document.head.appendChild(l);}
        
        // Preload critical resources to break dependency chain
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'SCRIPT' && node.src && node.src.includes('/assets/') && node.type === 'module') {
                var preload = document.createElement('link');
                preload.rel = 'modulepreload';
                preload.href = node.src;
                document.head.appendChild(preload);
              }
              if (node.tagName === 'LINK' && node.href && node.href.includes('/assets/') && node.rel === 'stylesheet') {
                var preload = document.createElement('link');
                preload.rel = 'preload';
                preload.href = node.href;
                preload.as = 'style';
                document.head.appendChild(preload);
              }
            });
          });
        });
        observer.observe(document.head, { childList: true, subtree: true });
        
        // Stop observing after 5 seconds to prevent memory leaks
        setTimeout(function() { observer.disconnect(); }, 5000);
      })();
    </script>
    
    <!-- Boot Watchdog: Prevents white screen by dynamically loading build assets if app fails to boot -->
    <script>
      (function() {
        var bootTimeout = setTimeout(function() {
          if (!window.__app_booted) {
            console.warn('🚨 App boot timeout - attempting manifest fallback');
            
            // Try to fetch manifest and inject correct assets
            var manifestPaths = ['.vite/manifest.json', 'assets/manifest.json', 'manifest.json'];
            var currentPath = 0;
            
            function tryManifest() {
              if (currentPath >= manifestPaths.length) {
                // All manifest paths failed - show error message
                document.getElementById('root').innerHTML = 
                  '<div style="padding: 40px; text-align: center; font-family: system-ui;">' +
                  '<h2 style="color: #dc2626;">Build not found</h2>' +
                  '<p>Please re-publish or ensure dist/ folder is being served.</p>' +
                  '<p style="font-size: 0.9em; color: #666; margin-top: 20px;">Debug: Tried paths: ' + manifestPaths.join(', ') + '</p>' +
                  '</div>';
                return;
              }
              
              fetch('/' + manifestPaths[currentPath])
                .then(function(response) {
                  if (!response.ok) throw new Error('Not found');
                  return response.json();
                })
                .then(function(manifest) {
                  console.log('📦 Manifest loaded, injecting assets:', manifest);
                  
                  // Find main.tsx entry
                  var mainEntry = manifest['src/main.tsx'];
                  if (mainEntry) {
                    // Inject CSS
                    if (mainEntry.css) {
                      mainEntry.css.forEach(function(cssPath) {
                        var link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = '/' + cssPath;
                        document.head.appendChild(link);
                      });
                    }
                    
                    // Inject JS
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = '/' + mainEntry.file;
                    document.body.appendChild(script);
                  }
                })
                .catch(function() {
                  currentPath++;
                  tryManifest();
                });
            }
            
            tryManifest();
          }
        }, 1500); // 1.5 second timeout
        
        // Clear timeout if app boots successfully
        window.__boot_watchdog_clear = function() {
          clearTimeout(bootTimeout);
        };
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Vite will inject proper modulepreloads during build -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
