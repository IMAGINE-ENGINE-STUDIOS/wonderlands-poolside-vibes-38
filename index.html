    <script>
      // Load CSS asynchronously to prevent render blocking
      (function() {
        var links = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          if (link.href && link.href.includes('index-') && link.href.includes('.css')) {
            link.media = 'print';
            link.onload = function() { this.media = 'all'; };
          }
        }
      })();

      // Unregister any existing service workers and clear caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
      }
      
      // Set canonical URL dynamically
      (function(){
        var l=document.querySelector('link[rel="canonical"]');
        var href=location.origin+location.pathname;
        if(l){l.setAttribute('href', href);} else {l=document.createElement('link');l.rel='canonical';l.href=href;document.head.appendChild(l);}
      })();
    </script>
    <script>
      (function(){
        function showError(msg){
          var el=document.getElementById('runtime-error-overlay');
          if(!el){
            el=document.createElement('div');
            el.id='runtime-error-overlay';
            el.style.cssText='position:fixed;z-index:99999;top:0;left:0;right:0;background:#fee;border-bottom:1px solid #f99;padding:12px 16px;font:14px/1.4 system-ui,sans-serif;color:#900';
            if(document.body){
              document.body.appendChild(el);
            }else{
              document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(el); el.textContent=msg; });
            }
          }
          el.textContent=msg;
        }
        window.addEventListener('error', function(e){ showError('JS Error: '+ (e.message || (e.error && e.error.message) || e.error || 'unknown')); });
        window.addEventListener('unhandledrejection', function(e){ var r=e.reason; showError('Unhandled Promise Rejection: '+ (r && r.message ? r.message : r)); });
      })();
    </script>
    
    <!-- Model Viewer for 3D visualization -->

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Enhance overlay with file/line info
      window.addEventListener('error', function(e){
        var details = '';
        try { details = ' at ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''); } catch(_) {}
        var msg = 'JS Error: ' + (e.message || (e.error && e.error.message) || e.error || 'unknown') + details;
        console.error(msg, e.error || e);
        var el = document.getElementById('runtime-error-overlay');
        if (el) el.textContent = msg;
      });
      window.addEventListener('unhandledrejection', function(e){
        var r = e.reason; var msg = 'Unhandled Promise Rejection: ' + (r && r.message ? r.message : r);
        console.error(msg, r);
        var el = document.getElementById('runtime-error-overlay');
        if (el) el.textContent = msg;
      });
    </script>
